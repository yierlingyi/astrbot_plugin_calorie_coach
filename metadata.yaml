name: astrbot_plugin_calorie_coach
display_name: 热量管家
short_desc: 边聊边记热量与营养：AI 自动建档、记饮食、查缺口、记体重，带营养分析与饮食日历。
desc: |
  把「算热量」这件事藏进聊天里。用户不用背指令、不用打开小程序，随口说吃了什么，
  AI 就会记录、换算热量、分析营养结构，并在该提醒的时候提醒。

  核心能力：
  - 档案：身高、体重、年龄、性别、活动量，目标体重与期限，自动算 BMR/TDEE 与每日热量、蛋白、脂肪、碳水目标
  - 饮食记录：一句话记多种食物，自动换算「一碗 / 一个 / 一杯」到克数，内置 221 条常见中式食物营养库
  - 食物库兜底：库里没有的食物（外卖、品牌食品、地方菜）由 AI 联网确认营养后入库并记录
  - 预设食物与食谱：自定义食物、一整餐的固定搭配，一句话记整餐
  - 营养分析：26 项营养素（热量、三大宏量、膳食纤维、钠、钾、钙、铁、锌、硒、维 A/D/E/K、B 族、维 C、叶酸、饱和脂肪、胆固醇）对照参考值，按当天已记录进度折算，指出缺什么、多什么、具体补多少克
  - 体重管理：只在称重的日子记录，BMI、周变化趋势、目标进度与预计达成时间
  - 饮食日历：每天热量、是否达标、当天体重，文字版与图片版（/饮食日历），每月平均与体重变化
  - 主动但不打扰：每天早晨推送今日目标、每晚推送总结与补餐建议、每周推送小结；对话中只在确有缺口或超标时补一句
